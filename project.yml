name: Coretan
options:
  bundleIdPrefix: com.coretan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic

targets:
  Coretan:
    type: application
    platform: iOS
    sources:
      - path: Sources/Coretan
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coretan.app
        INFOPLIST_FILE: Sources/Coretan/Info.plist
        TARGETED_DEVICE_FAMILY: "2"        # iPad only, per spec 16.1
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - sdk: PencilKit.framework
      - sdk: PDFKit.framework
      - sdk: Vision.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: libsqlite3.tbd

  CoretanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CoretanTests
    dependencies:
      - target: Coretan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Coretan:
    build:
      targets:
        Coretan: all
        CoretanTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoretanTests
    archive:
      config: Release
